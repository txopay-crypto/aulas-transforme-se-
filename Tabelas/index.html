<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tabelas</title>
    <style>
      table,
      td {
        border: 1px solid salmon;
        border-collapse: collapse;
      }
    </style>
  </head>
  <body>
    <!-- Estrutura da tabela -->
    <!-- 
    TABLE
    TR - table now
    TH - table header
    TD - table data 
     -->
    <table>
      <tr>
        <th>produtos</th>
        <th>preço</th>
      </tr>

      <tr>
        <td>café</td>
        <td>19,99</td>
      </tr>

      <!-- Terceira linha -->
      <tr>
        <td>Arroz</td>
        <td>R$ 24,99</td>
      </tr>
    </table>
  </body>
</html>
